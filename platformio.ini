; Maker LEDDisplay2 v2.2 (Soldered / e-radionica)
; ESP8266 + 2x IS31FL3731 → 32x9 greyscale charlieplex matrix
; Prog: external CP2102 on /dev/ttyUSB0 (GPIO0/RST if no auto-reset)

[env:maker_led_display2]
platform = espressif8266
board = esp12e
framework = arduino
monitor_speed = 9600
upload_speed = 115200
upload_port = /dev/ttyUSB0
monitor_port = /dev/ttyUSB0
board_build.f_cpu = 80000000L
board_build.flash_mode = dio
; most modules on these boards are 4MB; fall back to 1MB if upload complains
board_build.ldscript = eagle.flash.4m1m.ld
lib_deps =
    adafruit/Adafruit GFX Library @ ^1.11.9
build_flags =
    -DWAVE_W=32
    -DWAVE_H=9

; ArduinoOTA UDP is silent on this board — use HTTP:
;   curl -F firmware=@.pio/build/maker_led_display2/firmware.bin http://rage-matrix.local/update
; [env:maker_led_ota]
; extends = env:maker_led_display2
; upload_protocol = espota
; upload_port = rage-matrix.local
