name: ci
on:
  push:
  pull_request:
jobs:
  twins:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python twins
        run: |
          python3 - <<'PY'
          from sim.critters import Tank
          from sim.war import War
          t = Tank(); t.seed()
          w = War(); w.seed()
          for _ in range(80):
              t.step(); w.step()
          ts, ws = t.state(), w.state()
          assert ts["prey"] >= 0 and ws["west"] >= 0
          print("twins", ts, {k: ws[k] for k in ("west","east","match")})
          PY
      - uses: dtolnay/rust-toolchain@stable
      - name: Rust crate
        working-directory: rust/matrix-sim
        run: cargo test --release
